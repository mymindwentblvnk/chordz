<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Chordz">
    <title>Compose - Chordz</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="guide-styles.css">
    <script src="page-memory.js"></script>
    <script src="keep-awake.js" defer></script>
</head>
<body>
    <nav class="main-nav">
        <a href="training.html" class="nav-link">🎮 Training</a>
        <a href="chord-progressions.html" class="nav-link">📖 Chord Progressions</a>
        <a href="compose.html" class="nav-link active">🧭 Compose</a>
        <a href="plan.html" class="nav-link">🗓️ Plan</a>
        <a href="metronome.html" class="nav-link">⏱️ Metronome</a>
        <a href="find-note.html" class="nav-link">🎤 Find Note</a>
        <a href="find-scale.html" class="nav-link">🎼 Find Scale</a>
        <a href="wiki.html" class="nav-link">📚 Wiki</a>
    </nav>

    <div class="guide-container">
        <header style="text-align: center; margin-bottom: 20px;">
            <div class="header-icon" style="font-size: 2.5rem; margin-bottom: 5px;">🧭</div>
            <h1 style="background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin: 0 0 5px 0; font-size: 1.8rem;">Compose</h1>
            <p class="subtitle" style="margin: 0 0 8px 0; font-size: 0.95rem;">From a feeling to scale, chords and melody</p>
            <a href="compose-practice.html" class="chip" style="text-decoration: none; display: inline-block;">🏋️ Practice mode: Roman numerals to keys</a>
        </header>

        <div id="recipe" class="recipe-chips"></div>
        <div id="stepper" class="stepper"></div>

        <div class="guide-section compose-section" id="step-content">
            <noscript>This page needs JavaScript.</noscript>
        </div>
    </div>

    <style>
        .compose-section { max-width: 760px; margin: 0 auto 30px auto; }
        .compose-section h2 { font-size: 1.4rem; margin: 0 0 8px 0; }
        .compose-section h3 { font-size: 1.1rem; margin: 24px 0 8px 0; }
        .step-intro { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.5; margin: 0 0 16px 0; }
        .note-line { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5; margin: 8px 0; }
        .alias { color: var(--text-secondary); font-weight: normal; font-size: 0.85em; }

        /* Recipe chips */
        .recipe-chips { max-width: 760px; margin: 0 auto 12px auto; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 0; }
        .chip { padding: 6px 12px; font-size: 0.85rem; font-weight: 600; color: var(--text-primary); background: var(--surface); border: 1px solid var(--surface-light); border-radius: 999px; cursor: pointer; }
        .chip:hover { border-color: var(--primary-color); }

        /* Stepper */
        .stepper { max-width: 760px; margin: 0 auto 16px auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
        .stepper-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px; background: var(--surface); color: var(--text-secondary); border: 2px solid var(--surface); border-radius: 10px; cursor: pointer; font-size: 0.75rem; min-height: 52px; }
        .stepper-btn .stepper-icon { font-size: 1.2rem; }
        .stepper-btn.done { color: var(--text-primary); border-color: var(--surface-light); }
        .stepper-btn.active { color: white; background: var(--primary-color); border-color: var(--primary-color); }
        .stepper-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Choice cards */
        .choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 8px; }
        .choice-grid.single { grid-template-columns: 1fr; }
        .choice-card { text-align: left; padding: 16px; background: var(--surface); color: var(--text-primary); border: 2px solid var(--surface-light); border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: inherit; }
        .choice-card:hover { border-color: var(--primary-color); transform: translateY(-2px); }
        .choice-card.selected { border-color: var(--primary-color); background: rgba(99, 102, 241, 0.18); }
        .choice-icon { font-size: 1.8rem; margin-bottom: 6px; }
        .choice-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
        .choice-sub { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.4; }
        .choice-formula { font-size: 0.8rem; color: var(--text-secondary); margin-top: 6px; font-style: italic; }
        .prog-romans { font-family: 'Georgia', serif; font-size: 1rem; color: var(--primary-color); margin-bottom: 2px; }
        .prog-chords { font-family: 'Courier New', monospace; font-size: 0.95rem; margin-bottom: 6px; }

        /* Key buttons */
        .root-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 16px; }
        .root-btn { padding: 12px 4px; font-size: 0.95rem; font-weight: 700; background: var(--surface); color: var(--text-primary); border: 2px solid var(--surface-light); border-radius: 10px; cursor: pointer; min-height: 44px; font-family: inherit; }
        .root-btn:hover { border-color: var(--primary-color); }
        .root-btn.selected { background: var(--primary-color); border-color: var(--primary-color); color: white; }

        /* Result box */
        .result-box { background: var(--surface); border-left: 4px solid var(--primary-color); border-radius: 10px; padding: 16px; margin: 16px 0; }
        .result-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
        .scale-line { font-family: 'Courier New', monospace; font-size: 1rem; color: var(--text-secondary); margin-bottom: 12px; word-spacing: 2px; }

        /* Keyboard */
        .kb { position: relative; margin: 8px 0 6px 0; }
        .kb-whites { display: flex; height: 110px; }
        .kb-key span { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: 0.7rem; font-weight: 700; pointer-events: none; }
        .kb-white { position: relative; flex: 1; background: #e2e8f0; border: 1px solid #64748b; border-radius: 0 0 6px 6px; color: #0f172a; }
        .kb-black { position: absolute; top: 0; width: 5.2%; height: 62%; background: #0f172a; border: 1px solid #020617; border-radius: 0 0 4px 4px; z-index: 2; color: white; }
        .kb-white.is-scale { background: #c7d2fe; }
        .kb-black.is-scale { background: #4f46e5; }
        .kb-white.is-root { background: #818cf8; box-shadow: inset 0 -5px 0 #4338ca; }
        .kb-black.is-root { background: #6366f1; box-shadow: inset 0 -4px 0 #a5b4fc; }
        .kb-white.is-chord { background: #6ee7b7; }
        .kb-black.is-chord { background: #059669; }
        .kb-white.is-chord.is-root { box-shadow: inset 0 -5px 0 #4338ca; }
        .kb-black.is-chord.is-root { box-shadow: inset 0 -4px 0 #a5b4fc; }
        .kb-black span { font-size: 0.6rem; bottom: 3px; }
        .kb-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.8rem; color: var(--text-secondary); margin-top: 6px; }
        .kb-dot { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; background: #e2e8f0; }
        .kb-dot.is-scale { background: #c7d2fe; }
        .kb-dot.is-root { background: #818cf8; }
        .kb-dot.is-chord { background: #6ee7b7; }

        /* Chords */
        .segmented { display: inline-flex; border: 2px solid var(--surface-light); border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
        .segmented button { padding: 10px 18px; font-size: 0.95rem; font-weight: 600; background: var(--surface); color: var(--text-secondary); border: none; cursor: pointer; min-height: 44px; font-family: inherit; }
        .segmented button.selected { background: var(--primary-color); color: white; }
        .chord-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(95px, 1fr)); gap: 10px; margin: 12px 0; }
        .chord-card { position: relative; padding: 12px 6px; text-align: center; background: var(--surface); color: var(--text-primary); border: 2px solid var(--surface-light); border-radius: 10px; cursor: pointer; font-family: inherit; }
        .chord-card:hover { border-color: var(--accent-happy); }
        .chord-card.selected { border-color: var(--accent-happy); background: rgba(16, 185, 129, 0.15); }
        .chord-roman { font-family: 'Georgia', serif; font-size: 0.95rem; color: var(--primary-color); }
        .chord-symbol { font-size: 1.15rem; font-weight: 700; margin: 2px 0; }
        .chord-notes { font-family: 'Courier New', monospace; font-size: 0.78rem; color: var(--text-secondary); }
        .home-badge { position: absolute; top: -9px; right: 6px; background: var(--primary-color); color: white; font-size: 0.65rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; }

        /* Progression strip */
        .chord-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .strip-chord { flex: 1 1 80px; text-align: center; padding: 10px 6px; background: var(--surface-light); border-radius: 8px; border: 2px solid transparent; }
        .strip-chord.active { border-color: var(--accent-happy); background: rgba(16, 185, 129, 0.2); }
        .loop-btn { width: 100%; margin-bottom: 8px; }

        /* Lists, tables, hints */
        .tip-list { margin: 8px 0 8px 20px; padding: 0; color: var(--text-secondary); font-size: 0.92rem; line-height: 1.55; }
        .tip-list li { margin-bottom: 6px; }
        .try-it { margin: 20px 0 8px 0; padding: 12px 14px; background: rgba(245, 158, 11, 0.12); border-left: 4px solid var(--accent-energetic); border-radius: 8px; font-size: 0.92rem; line-height: 1.5; color: var(--text-primary); }
        .learn-more { margin: 12px 0 0 0; font-size: 0.85rem; color: var(--text-secondary); }
        .learn-more a { color: var(--primary-color); text-decoration: none; }
        .learn-more a:hover { text-decoration: underline; }
        .recipe-card { background: var(--surface); border-radius: 10px; padding: 14px 16px; line-height: 1.7; font-size: 0.95rem; border-left: 4px solid var(--accent-dreamy); }
        .tone-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
        .tone-table th, .tone-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--surface-light); }
        .tone-table th { color: var(--text-secondary); font-weight: 600; }
        .tone-table td:first-child { font-weight: 700; }

        /* Motif */
        .motif-notes { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
        .motif-note { font-size: 1.4rem; font-weight: 700; padding: 6px 14px; background: var(--surface-light); border-radius: 8px; }
        .motif-arrow { color: var(--text-secondary); }
        .button-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }

        /* Navigation buttons */
        .step-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; }
        .nav-btn { padding: 12px 22px; font-size: 1rem; font-weight: 600; border-radius: 10px; border: 2px solid transparent; cursor: pointer; min-height: 46px; font-family: inherit; }
        .nav-btn.primary { background: var(--primary-color); color: white; }
        .nav-btn.secondary { background: var(--surface); color: var(--text-primary); border-color: var(--surface-light); }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .nav-btn:not(:disabled):hover { filter: brightness(1.1); }

        @media (max-width: 600px) {
            .stepper-label { display: none; }
            .root-grid { grid-template-columns: repeat(4, 1fr); }
            .kb-whites { height: 90px; }
            .chord-grid { grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
    <script src="music-theory.js"></script>
    <script src="compose-data.js"></script>
    <script src="compose.js"></script>
</body>
</html>
